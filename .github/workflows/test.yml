name: Validate updater
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: updater-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
